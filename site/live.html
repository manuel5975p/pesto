<!doctype html>
<!-- Live run viewer for the web_<out>/ frame format (docs/viewer-format.md).
     Serve the repo statically (python3 -m http.server) and open
         site/live.html?run=../build/web_<out>
     Polls manifest.json, follows the live tail, scrubbable. No deps. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNS live</title>
<style>
  :root{
    --bg:#0b0d11; --panel:#12151c; --edge:#232a36; --ink:#e7ebf2;
    --mut:#8b94a5; --acc:#37d6c6; --hot:#e0562e; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif;
    overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}

  header{display:flex;align-items:baseline;gap:14px;padding:12px 18px 10px;
    flex-wrap:wrap}
  header h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
  #chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font:600 11px/1 ui-monospace,SFMono-Regular,monospace;
    letter-spacing:.05em;padding:5px 8px;border:1px solid var(--edge);
    border-radius:6px;color:var(--mut);text-transform:uppercase}
  #status{margin-left:auto;display:flex;align-items:center;gap:8px;
    font:600 12px/1 ui-monospace,monospace;color:var(--mut)}
  #dot{width:9px;height:9px;border-radius:50%;background:#3fbf6f;
    box-shadow:0 0 6px #3fbf6f}
  #dot.paused{background:#c9a227;box-shadow:0 0 6px #c9a227}
  #dot.stale{background:#666;box-shadow:none}

  #stage{flex:1;display:flex;align-items:center;justify-content:center;
    min-height:0;padding:4px 18px;position:relative}
  #cv{max-width:100%;max-height:100%;border-radius:10px;
    border:1px solid var(--edge);background:#000;
    box-shadow:0 12px 40px rgba(0,0,0,.45)}
  #cap{position:absolute;top:14px;left:28px;
    font:600 12px/1 ui-monospace,monospace;letter-spacing:.05em;
    color:var(--ink);background:rgba(11,13,17,.65);border:1px solid var(--edge);
    border-radius:6px;padding:6px 9px;pointer-events:none;
    text-transform:uppercase}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on:hover{color:#04211d}
  .btn:hover{border-color:var(--acc)}

  footer{padding:10px 18px 14px;display:flex;flex-direction:column;gap:10px}
  #row1{display:flex;align-items:center;gap:10px}
  .tabs{display:flex;border:1px solid var(--edge);border-radius:8px;
    overflow:hidden}
  .tabs button{background:transparent;border:0;color:var(--mut);
    font:600 12px/1 ui-monospace,monospace;letter-spacing:.05em;
    padding:8px 14px;cursor:pointer;text-transform:uppercase}
  .tabs button.on{background:var(--acc);color:#04211d}
  .btn{background:var(--panel);border:1px solid var(--edge);color:var(--ink);
    border-radius:8px;padding:7px 13px;cursor:pointer;
    font:600 12px/1 ui-monospace,monospace;letter-spacing:.04em}
  .btn.on{background:var(--acc);border-color:var(--acc);color:#04211d}
  .btn:active{transform:translateY(1px)}
  #tinfo{margin-left:auto;font:600 13px/1 ui-monospace,monospace;
    color:var(--ink);white-space:nowrap}
  #tinfo small{color:var(--mut);font-weight:500}

  #row2{display:flex;align-items:center;gap:14px}
  #scrub{flex:1;-webkit-appearance:none;appearance:none;height:6px;
    background:var(--edge);border-radius:3px;outline:none;cursor:pointer}
  #scrub::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
    border-radius:50%;background:var(--acc);border:2px solid #04211d;
    cursor:grab}
  #scrub::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
    background:var(--acc);border:2px solid #04211d;cursor:grab}
  #cbarwrap{display:flex;align-items:center;gap:8px;
    font:500 11px/1 ui-monospace,monospace;color:var(--mut);min-width:260px}
  #cbar{width:160px;height:10px;border-radius:5px;border:1px solid var(--edge)}

  #err{position:fixed;bottom:14px;right:18px;color:#f2785c;
    font:600 12px/1 ui-monospace,monospace;max-width:40ch;text-align:right}
  #hint{color:var(--mut);font-size:11.5px}
  kbd{border:1px solid var(--edge);border-bottom-width:2px;border-radius:4px;
    padding:0 5px;font:600 10.5px/1.6 ui-monospace,monospace;color:var(--mut)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">connecting…</h1>
    <div id="chips"></div>
    <div id="status"><span id="dot"></span><span id="stat">live</span></div>
  </header>
  <div id="stage"><canvas id="cv"></canvas><span id="cap"></span></div>
  <footer>
    <div id="row1">
      <div id="tabs" class="tabs"></div>
      <div id="ptabs" class="tabs" style="display:none"></div>
      <div id="otabs" class="tabs" style="display:none"></div>
      <button class="btn on" id="bLive">● live</button>
      <button class="btn" id="bPlay">▶ play</button>
      <button class="btn" id="bPrev">‹</button>
      <button class="btn" id="bNext">›</button>
      <span id="hint"><kbd>←</kbd><kbd>→</kbd> step &nbsp;<kbd>space</kbd> live</span>
      <span id="tinfo">–</span>
    </div>
    <div id="row2">
      <input id="scrub" type="range" min="0" max="0" value="0">
      <div id="cbarwrap">
        <span id="cbLo"></span><canvas id="cbar" width="256" height="1"></canvas>
        <span id="cbHi"></span><span id="cbNow"></span>
      </div>
    </div>
  </footer>
</div>
<div id="err"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const run = new URLSearchParams(location.search).get("run") || "web_run";
const cv = $("cv"), ctx = cv.getContext("2d");

// Plane siblings: web_<out>/planes.json (written by the app) lists
// {suf, axis, off-in-D} entries; fallback = probe the three centre planes.
// Selection = axis tab (xy/xz/yz) + offset tab (-nD / mid / +nD).
let planes = [], axis = "xy", off = 0;
let dir = run;

let man = null, cur = -1, fieldIdx = 0, mask = null;
let mode = "live";              // live | play | pause
let lastGrowth = Date.now();
const cache = new Map();

// Colormaps match src/dns/fieldpng.cpp.
const MID=[221,221,221], CLO=[59,76,192], CHI=[180,4,38];
const VIR=[[68,1,84],[72,40,120],[62,74,137],[49,104,142],[38,130,142],
           [31,158,137],[53,183,121],[109,205,89],[180,222,44],[253,231,37]];
function diva(t){ const s=t*2-1, b=s<0?CLO:CHI, f=Math.abs(s);
  return [MID[0]+(b[0]-MID[0])*f, MID[1]+(b[1]-MID[1])*f, MID[2]+(b[2]-MID[2])*f]; }
function seqa(t){ const s=Math.min(1,Math.max(0,t))*9, a=Math.min(8,s|0), f=s-a;
  return [0,1,2].map(i=>VIR[a][i]+(VIR[a+1][i]-VIR[a][i])*f); }

// 65536-entry LUTs per kind, rebuilt on field switch.
let lut = null;
function buildLut(kind){
  lut = new Uint8Array(65536*3);
  for (let q=0; q<65536; ++q){
    const t=q/65535, c=kind==="diverging"?diva(t):seqa(t);
    lut[q*3]=c[0]; lut[q*3+1]=c[1]; lut[q*3+2]=c[2];
  }
  const cb=$("cbar").getContext("2d"), img=cb.createImageData(256,1);
  for (let i=0;i<256;++i){ const c=kind==="diverging"?diva(i/255):seqa(i/255);
    img.data.set([c[0],c[1],c[2],255], i*4); }
  cb.putImageData(img,0,0);
}

async function fetchU16(url,n){
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error(url.split("/").pop()+" "+r.status);
  const b=await r.arrayBuffer();
  if(b.byteLength<2*n) throw new Error("short "+url.split("/").pop());
  return new Uint16Array(b,0,n);
}
async function frameData(fi,idx){
  const key=dir+"/"+fi.name+"/"+idx;
  if(cache.has(key)) return cache.get(key);
  const d=await fetchU16(dir+"/"+fi.file.replace("%05d",String(idx).padStart(5,"0")),
                         man.grid.nx*man.grid.ny);
  if(cache.size>80) cache.delete(cache.keys().next().value);
  cache.set(key,d);
  return d;
}

let drawing=false;
async function draw(idx){
  if(!man || idx<0 || idx>=man.frames.length || drawing) return;
  drawing=true;
  try{
    const fi=man.fields[fieldIdx];
    const d=await frameData(fi,idx);
    const {nx,ny}=man.grid, img=ctx.createImageData(nx,ny);
    const px=img.data;
    for(let r=0;r<ny;++r){
      const j=ny-1-r;                       // row 0 = bottom
      let p=(r*nx)*4, c=j*nx;
      for(let i=0;i<nx;++i,++c,p+=4){
        if(mask && mask[c]<32768){ px[p]=18;px[p+1]=20;px[p+2]=25; }
        else{ const q=d[c]*3; px[p]=lut[q];px[p+1]=lut[q+1];px[p+2]=lut[q+2]; }
        px[p+3]=255;
      }
    }
    ctx.putImageData(img,0,0);
    cur=idx; $("scrub").value=idx;
    const fr=man.frames[idx], mm=fr.minmax[fi.name];
    $("cap").textContent=(planes.length>1?planeLabel()+" · ":"")+fi.name;
    $("tinfo").innerHTML="t="+fr.t.toFixed(2)+" <small>frame "+(idx+1)+"/"+
      man.frames.length+"</small>";
    $("cbNow").textContent=mm?("["+mm[0].toPrecision(3)+", "+
      mm[1].toPrecision(3)+"]"):"";
    $("err").textContent="";
  }catch(e){ $("err").textContent=String(e.message||e); }
  drawing=false;
}

function setStatus(){
  const dot=$("dot"), stale=Date.now()-lastGrowth>15000;
  dot.className=mode==="live"?(stale?"stale":""):"paused";
  $("stat").textContent=mode==="live"?(stale?"idle":"live"):mode;
  $("bLive").classList.toggle("on",mode==="live");
  $("bPlay").classList.toggle("on",mode==="play");
}

function setField(i){
  fieldIdx=i;
  const fi=man.fields[i];
  buildLut(fi.kind);
  $("cbLo").textContent=fi.range[0]; $("cbHi").textContent=fi.range[1];
  [...$("tabs").children].forEach((b,k)=>b.classList.toggle("on",k===i));
  draw(cur<0?man.frames.length-1:cur);
}

async function poll(){
  try{
    const r=await fetch(dir+"/manifest.json",{cache:"no-store"});
    if(!r.ok) throw new Error("manifest "+r.status);
    const m=await r.json(), first=!man, n0=man?man.frames.length:0;
    man=m;
    if(m.frames.length>n0) lastGrowth=Date.now();
    if(first){
      cv.width=m.grid.nx; cv.height=m.grid.ny;
      $("title").textContent=run.replace(/^.*web_/,"");
      $("chips").innerHTML=Object.entries(m.sim||{})
        .map(([k,v])=>"<span class='chip'>"+k+" "+v+"</span>").join("");
      $("tabs").innerHTML=m.fields
        .map((f,i)=>"<button onclick='setField("+i+")'>"+f.name+"</button>").join("");
      const st=(m.static||[]).find(s=>s.name==="mask");
      mask=st?await fetchU16(dir+"/"+st.file,m.grid.nx*m.grid.ny)
              .catch(()=>null):null;
      setField(Math.min(fieldIdx,m.fields.length-1));
    }
    $("scrub").max=Math.max(0,m.frames.length-1);
    if(mode==="live"&&m.frames.length) draw(m.frames.length-1);
    setStatus();
  }catch(e){ $("err").textContent=String(e.message||e); }
}

function offLabel(o){ return o?((o>0?"+":"−")+Math.abs(o).toFixed(2)+"D"):"mid"; }
function planeLabel(){ return axis+(off?" "+offLabel(off):""); }
function renderPlaneTabs(){
  if(planes.length<2){ $("ptabs").style.display=$("otabs").style.display="none"; return; }
  const axes=[...new Set(planes.map(p=>p.axis))];
  $("ptabs").style.display="flex";
  $("ptabs").innerHTML=axes.map(a=>
    "<button onclick='setAxis(\""+a+"\")'"+(a===axis?" class='on'":"")+">"+
    a+"</button>").join("");
  const offs=planes.filter(p=>p.axis===axis).sort((a,b)=>a.off-b.off);
  $("otabs").style.display=offs.length>1?"flex":"none";
  $("otabs").innerHTML=offs.map(p=>
    "<button onclick='setOff("+p.off+")'"+(p.off===off?" class='on'":"")+">"+
    offLabel(p.off)+"</button>").join("");
}
function switchTo(a,o){
  const c=planes.filter(p=>p.axis===a);
  if(!c.length) return;
  const p=c.reduce((x,y)=>Math.abs(y.off-o)<Math.abs(x.off-o)?y:x,c[0]);
  axis=a; off=p.off;
  renderPlaneTabs();
  if(p.dir===dir) return;
  dir=p.dir;
  const keep=cur;
  man=null; cur=-1; mask=null; cache.clear();
  poll().then(()=>{ if(mode!=="live"&&man&&keep>=0)
    draw(Math.min(keep,man.frames.length-1)); });
}
function setAxis(a){ switchTo(a,off); }
function setOff(o){ switchTo(axis,o); }
async function probePlanes(){
  try{
    const r=await fetch(run+"/planes.json",{cache:"no-store"});
    if(r.ok){
      const l=(await r.json()).planes||[];
      planes=l.map(p=>({dir:run+p.suf,axis:p.axis,off:p.off||0}));
    }
  }catch(e){}
  if(!planes.length){       // older runs: probe the three centre planes
    const cand=[{suf:"",axis:"xy"},{suf:"_xz",axis:"xz"},{suf:"_yz",axis:"yz"}];
    const have=await Promise.all(cand.map(p=>
      fetch(run+p.suf+"/manifest.json",{cache:"no-store"})
        .then(r=>r.ok).catch(()=>false)));
    planes=cand.filter((p,i)=>have[i]).map(p=>({dir:run+p.suf,axis:p.axis,off:0}));
  }
  renderPlaneTabs();
}

function setMode(m){ mode=m; setStatus(); }
$("bLive").onclick=()=>{ setMode(mode==="live"?"pause":"live");
  if(mode==="live") poll(); };
$("bPlay").onclick=()=>setMode(mode==="play"?"pause":"play");
$("bPrev").onclick=()=>{ setMode("pause"); draw(cur-1); };
$("bNext").onclick=()=>{ setMode("pause"); draw(cur+1); };
$("scrub").oninput=e=>{ setMode("pause"); draw(+e.target.value); };
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){ setMode("pause"); draw(cur-1); }
  else if(e.key==="ArrowRight"){ setMode("pause"); draw(cur+1); }
  else if(e.key===" "){ $("bLive").onclick(); e.preventDefault(); }
});
setInterval(()=>{ if(mode==="play"&&man)
  draw(cur+1>=man.frames.length?0:cur+1); }, 1000/12);
poll();
probePlanes();
setInterval(poll,1500);
</script>
</body>
</html>

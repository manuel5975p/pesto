# The 256^3 Re 1e4 sigma-LES sphere pilot (sphere256sigma_re1e4.toml), redone
# incompressible: projection solver, --far tunnel (incompressible default),
# no Mach/ramp. Same model: sigma, Csigma = 1.35 -- FILTERED field.
#
#   build/dns --config sphere256sigma_re1e4_incomp.toml

subcommand = "flow"
physics = "incompressible"
body = "sphere"
n = 256
nz = 256
dr = 4
re = 1e4
les = 0.17
sgs = "smag"
ft = 0.5
pdt = 3
# (no vort_signed: incompressible frames are already signed z-vorticity)
vort_map = "asinh"
vort_max = 60
speed_map = "delta"
emit = ["stats", "bin"]
out = "/tmp/dns/rippleprobe_smag"
